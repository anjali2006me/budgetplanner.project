<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · BudgetWise</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">
<main class="auth-card">
  <div class="brand"><span class="logo">₹</span><span>BudgetWise</span></div>
  <h1 id="heading">Welcome back</h1>
  <p class="sub" id="lead">Sign in to see your budget.</p>

  <div class="seg auth-tabs" role="tablist" aria-label="Account">
    <label><input type="radio" name="tab" value="signin" checked><span>Sign in</span></label>
    <label><input type="radio" name="tab" value="signup"><span>Create account</span></label>
  </div>

  <form id="form" class="auth-form" novalidate>
    <label id="nameRow" hidden>Name
      <input id="name" class="input" type="text" autocomplete="name" maxlength="40" placeholder="Your name">
    </label>
    <label>Email
      <input id="email" class="input" type="email" autocomplete="email" required placeholder="you@example.com">
    </label>
    <label>Password
      <input id="password" class="input" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">
    </label>
    <p id="msg" class="form-error" role="alert" hidden></p>
    <p id="info" class="form-info" role="status" hidden></p>
    <button class="btn primary" id="submit">Sign in</button>
  </form>

  <p class="note" id="modeNote"></p>
</main>

<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script src="js/login.js"></script>
</body>
</html>
