<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reports · BudgetWise</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="reports">
<div class="layout">
  <aside id="nav" class="sidebar"></aside>
  <main class="main">
    <header class="page-head">
      <div><h1>Monthly report</h1><p class="sub" id="subtitle">Spending patterns and budget performance</p></div>
      <div class="head-actions">
        <select id="month" class="select" aria-label="Month"></select>
        <button class="btn" id="exportReport">Export report CSV</button>
        <button class="btn" id="exportTx">Export month's transactions</button>
      </div>
    </header>

    <section class="kpis" id="kpis"></section>

    <section class="grid two">
      <div class="card"><h3>6-month trend</h3><div id="trend"></div></div>
      <div class="card"><h3>Where the money went</h3><div id="donut"></div></div>
    </section>

    <section class="grid two">
      <div class="card"><h3>Category breakdown</h3><div class="table-wrap" id="breakdown"></div></div>
      <div class="card"><h3>Largest expenses</h3><div class="table-wrap" id="top"></div></div>
    </section>
  </main>
</div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/reports.js"></script>
</body>
</html>
