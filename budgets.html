<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Budgets · BudgetWise</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="budgets">
<div class="layout">
  <aside id="nav" class="sidebar"></aside>
  <main class="main">
    <header class="page-head">
      <div><h1>Budgets</h1><p class="sub">Set a monthly limit for each expense category and track it</p></div>
      <div class="head-actions"><select id="month" class="select" aria-label="Month"></select></div>
    </header>

    <section class="kpis three" id="kpis"></section>

    <div class="card">
      <h3>Monthly limits</h3>
      <div class="table-wrap" id="tableWrap"></div>
      <p class="note">Type a limit and press Enter or click away to save it. Clear the field (or enter 0) to remove a budget. Limits apply to every month.</p>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/budgets.js"></script>
</body>
</html>
