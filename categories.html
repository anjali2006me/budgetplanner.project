<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Categories · BudgetWise</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="categories">
<div class="layout">
  <aside id="nav" class="sidebar"></aside>
  <main class="main">
    <header class="page-head">
      <div><h1>Categories</h1><p class="sub">Organise your income and expenses</p></div>
      <div class="head-actions">
        <button class="btn" id="resetBtn">Reset sample data</button>
        <button class="btn primary" id="addBtn">+ New category</button>
      </div>
    </header>

    <section class="grid two">
      <div class="card"><h3>Expense categories</h3><ul class="cat-list" id="expenseList"></ul></div>
      <div class="card"><h3>Income categories</h3><ul class="cat-list" id="incomeList"></ul></div>
    </section>

    <div class="card">
      <h3>Where is my data stored?</h3>
      <p id="storageInfo" class="sub"></p>
    </div>
  </main>
</div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
<script src="js/categories.js"></script>
</body>
</html>
